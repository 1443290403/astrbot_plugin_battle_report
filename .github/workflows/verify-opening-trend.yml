name: Verify opening-date trends
on:
  push:
    branches: [codex/month-opening-trend-check]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 25384e33ae1f2f815ebebe4407623f8c28d84496
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install -r requirements.txt pytest pytest-asyncio PyYAML cryptography
      - run: python -m pytest -q tests/
      - run: |
          git archive --format=zip --output=/tmp/astrbot_plugin_battle_report-1.36.3.zip HEAD
          python - <<'PY'
          import ast
          import urllib.request
          import os
          import zipfile
          import yaml

          def source(path):
              url = 'https://raw.githubusercontent.com/AstrBotDevs/AstrBot/v4.27.3/' + path
              return ast.parse(urllib.request.urlopen(url, timeout=20).read())
          updater = source('astrbot/core/star/updater.py')
          base = source('astrbot/core/zip_updater.py')
          derived = next(n for n in updater.body if isinstance(n, ast.ClassDef) and n.name == '_PluginUpdater')
          root = next(n for n in base.body if isinstance(n, ast.ClassDef) and n.name == '_RepoZipUpdater')
          methods = [n for cls in [derived, root] for n in cls.body if isinstance(n, ast.FunctionDef)
                     and n.name in {'find_plugin_metadata_entry', 'validate_plugin_metadata',
                                    'inspect_plugin_archive', '_resolve_archive_root_dir'}]
          constants = [n for n in updater.body if isinstance(n, ast.Assign)
                       and any(isinstance(t, ast.Name) and t.id.startswith('PLUGIN_METADATA_') for t in n.targets)]
          check = ast.ClassDef(name='ArchiveCheck', bases=[], keywords=[], body=methods, decorator_list=[])
          module = ast.Module(body=ast.parse('from __future__ import annotations').body + constants + [check], type_ignores=[])
          scope = dict(os=os, zipfile=zipfile, yaml=yaml)
          exec(compile(ast.fix_missing_locations(module), 'archive_validator', 'exec'), scope)
          result = scope['ArchiveCheck'].inspect_plugin_archive('/tmp/astrbot_plugin_battle_report-1.36.3.zip')
          assert result['metadata_entry'] == 'metadata.yaml' and result['metadata']['version'] == '1.36.3'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astrbot-plugin-battle-report-1.36.3
          path: /tmp/astrbot_plugin_battle_report-1.36.3.zip
          retention-days: 7
