server {
    listen 80;
    server_name reports.example.com;
    return 308 https://$host$request_uri;
}

# Public entry: replace reports.example.com and certificate paths with your domain.
server {
    listen 443 ssl;
    server_name reports.example.com;
    ssl_certificate /etc/letsencrypt/live/reports.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reports.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/battle-report-web-1.31.0;
    index index.html;
    client_max_body_size 1m;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;

    location = /api/auth/login {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:6185;
    }
    location = /api/auth/logout {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:6185;
    }
    location ^~ /api/plug/astrbot_plugin_battle_report/comparison/ {
        limit_except GET POST { deny all; }
        proxy_buffering off;
        proxy_pass http://127.0.0.1:6185;
    }
    location ^~ /battle-report/auth/ {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:6185;
    }
    location ^~ /battle-report/api/comparison/ {
        limit_except GET POST { deny all; }
        proxy_buffering off;
        proxy_pass http://127.0.0.1:6185;
    }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
